name: 시연판 날씨 · 공휴일 갱신

on:
  schedule:
    - cron: "17 * * * *"   # 매시 17분 (한국 시간 기준 매시간)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: live-weather
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 기상청 단기예보 · 특일정보 받기
        env:
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
        run: python scripts/live_weather.py
      - name: 바뀐 자료만 커밋
        run: |
          if [ -n "$(git status --porcelain static/live)" ]; then
            git config user.name "kyle-bbajo"
            git config user.email "kyle-bbajo@users.noreply.github.com"
            git add static/live
            git commit -m "시연판 날씨 · 공휴일 갱신"
            git push
          fi
